name: อัปเดต NAV จาก กบข.
on:
  schedule:
    - cron: '47 1 * * *'    # 08:47 เวลาไทย (GitHub อาจเริ่มช้ากว่านี้ได้หลายชั่วโมง)
    - cron: '47 12 * * *'   # 19:47 เวลาไทย
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: update-nav
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ดึง NAV
        id: fetch
        run: python scripts/update_nav.py
      # บันทึกทั้ง NAV ใหม่และ log ผลการรัน แม้ขั้นตอนดึง NAV จะล้มเหลว (เพื่อให้แอปแสดงสาเหตุได้)
      - name: บันทึกผล
        if: always()
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "gpf-nav-bot"
            git config user.email "gpf-nav-bot@users.noreply.github.com"
            git add data/nav.json data/nav-log.json
            if git diff --cached --quiet -- data/nav.json; then msg="NAV log $(date -u +%Y-%m-%dT%H:%MZ)"; else msg="NAV $(date -u +%Y-%m-%d)"; fi
            git commit -m "$msg"
            for i in 1 2 3; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push && break; sleep 5; done
          else
            echo "ไม่มีการเปลี่ยนแปลง"
          fi
