<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2747B0">
<meta name="description" content="สมุดบัญชี กบข. ส่วนตัว ติดตามมูลค่า เงินต้น ผลตอบแทน และจัดอันดับทุกแผน ข้อมูลอยู่ในเครื่องคุณ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GPF Journal">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>GPF Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one mobile column (max 560px) — sticky header, stacked ledger cards, bottom tab bar; desktop centers the column */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface-2:#F5F7FA; --ink:#111927; --ink-2:#465264; --muted:#768195;
  --line:#DCE1E8; --line-2:#E9EDF2;
  --accent:#2747B0; --accent-ink:#FFFFFF; --accent-soft:#E4EAFB;
  --gold:#A3741A; --gold-soft:#F6EEDC;
  --up:#0B8546; --up-soft:#E0F3E8; --down:#CC3535; --down-soft:#FBE5E5; --warn:#B26B00; --warn-soft:#FCEFD9;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --shadow:0 1px 2px rgba(17,25,39,.06),0 4px 16px rgba(17,25,39,.05);
  --f-display:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px; --r-s:9px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1019; --surface:#131A26; --surface-2:#19212F; --ink:#E7EBF2; --ink-2:#B1BACA; --muted:#7F8A9D;
  --line:#263044; --line-2:#1F2838;
  --accent:#8DA5FF; --accent-ink:#0B1019; --accent-soft:#1C2747;
  --gold:#E2B65E; --gold-soft:#2E2614;
  --up:#33C474; --up-soft:#10291B; --down:#FF6E6E; --down-soft:#341616; --warn:#F0B44C; --warn-soft:#2F2412;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1019; --surface:#131A26; --surface-2:#19212F; --ink:#E7EBF2; --ink-2:#B1BACA; --muted:#7F8A9D;
  --line:#263044; --line-2:#1F2838;
  --accent:#8DA5FF; --accent-ink:#0B1019; --accent-soft:#1C2747;
  --gold:#E2B65E; --gold-soft:#2E2614;
  --up:#33C474; --up-soft:#10291B; --down:#FF6E6E; --down-soft:#341616; --warn:#F0B44C; --warn-soft:#2F2412;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:560px;margin:0 auto;padding-block:0 96px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .ink2{color:var(--ink-2)}
.up{color:var(--up)} .down{color:var(--down)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.25}
h2{font-size:17px;font-weight:600}
h3{font-size:15px;font-weight:600}
.eyebrow{font-size:12px;letter-spacing:.04em;color:var(--muted);font-weight:500}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.top-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:9px;margin-right:auto;min-width:0}
.mark{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;flex:none}
.mark svg{display:block}
.brand b{font-family:var(--f-display);font-size:17px;letter-spacing:.01em;font-weight:700}
.brand small{display:block;font-size:11px;color:var(--muted);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.icon-btn svg{width:19px;height:19px;stroke:var(--ink-2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-btn[aria-pressed="true"]{background:var(--accent-soft);border-color:transparent}
.icon-btn[aria-pressed="true"] svg{stroke:var(--accent)}

/* cards */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 2px 10px}
.sec-h h2{font-size:16px}
.link{color:var(--accent);background:none;border:0;padding:0;font-weight:500;font-size:14px}

/* hero */
.hero{padding:18px 16px 14px}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.datestep{display:flex;align-items:center;gap:4px;background:var(--surface-2);border-radius:999px;padding:3px}
.datestep button{border:0;background:none;width:30px;height:28px;border-radius:999px;display:grid;place-items:center;color:var(--ink-2)}
.datestep button:disabled{opacity:.3;cursor:default}
.datestep span{font-size:13px;padding:0 4px;white-space:nowrap}
.big{font-family:var(--f-display);font-size:clamp(34px,10vw,44px);font-weight:700;letter-spacing:-.01em;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}
.big small{font-size:.5em;font-weight:600;color:var(--ink-2)}
.big .cur{font-size:.62em;margin-right:2px;color:var(--ink-2)}
.delta{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px;padding:3px 9px;border-radius:999px}
.delta.up{background:var(--up-soft)} .delta.down{background:var(--down-soft)} .delta.flat{background:var(--surface-2);color:var(--ink-2)}
.kv3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.kv3>div{min-width:0}
.kv3 .v{font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv3 .k{font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}

.periods{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.period{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 13px;border:0;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.period .k{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.period .v{font-family:var(--f-display);font-weight:600;font-size:19px;font-variant-numeric:tabular-nums;white-space:nowrap}
.period .p{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.period .s{font-size:11.5px;color:var(--muted)}

/* chips & segmented */
.seg{display:flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:2px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;border:0;background:none;border-radius:8px;padding:6px 10px;font-size:13.5px;color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:500}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--up-soft);color:var(--up)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--down-soft);color:var(--down)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}

/* chart */
.chart{position:relative;margin-top:8px;touch-action:pan-y;user-select:none}
.chart svg{display:block;width:100%;overflow:visible}
.chart .tip{position:absolute;top:0;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:12px;box-shadow:var(--shadow);white-space:nowrap;z-index:2;line-height:1.45}
.chart .tip b{font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink-2);margin-top:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:3px;margin-right:6px}
.legend i.dash{background:repeating-linear-gradient(90deg,var(--gold) 0 4px,transparent 4px 7px)!important}

/* holdings */
.hold{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 0;border-top:1px solid var(--line-2)}
.hold:first-child{border-top:0;padding-top:2px}
.hold .n{font-weight:600;display:flex;align-items:center;gap:6px;min-width:0}
.hold .sub{font-size:12.5px;color:var(--muted)}
.hold .r{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;display:flex;gap:2px}
.bar span{display:block;height:100%;border-radius:3px}

/* tables */
.tbl-wrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-weight:500;color:var(--muted);font-size:12px;text-align:right;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 6px;border-bottom:1px solid var(--line-2);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:0}
th:last-child,td:last-child{padding-right:0}
tr.sum td{font-weight:600;border-bottom:0}
td.l{text-align:left}
.tbl-wrap th:first-child,.tbl-wrap td:first-child{position:sticky;left:0;background:var(--surface);z-index:1;padding-right:8px}

/* ranking */
.rank{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line-2)}
.rank:first-child{border-top:0}
.rank .no{width:24px;height:24px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--ink-2)}
.rank.top .no{background:var(--ink);color:var(--surface)}
.rank.mine{background:var(--accent-soft);margin:0 -10px;padding:10px;border-radius:10px;border-top-color:transparent}
.rank .nm{font-weight:500;min-width:0}
.rank .meter{grid-column:2;height:4px;background:var(--surface-2);border-radius:2px;position:relative;overflow:hidden}
.rank .meter span{position:absolute;top:0;bottom:0;border-radius:2px}
.rank .pct{grid-row:1/span 2;grid-column:3;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}

/* periods timeline */
.tl{display:flex;height:30px;border-radius:8px;overflow:hidden;gap:2px;margin:6px 0 4px}
.tl button{border:0;padding:0;font-size:11px;color:var(--accent-ink);font-weight:600;overflow:hidden;white-space:nowrap;min-width:6px}
.era{border-left:3px solid var(--c,var(--accent));padding-left:12px}
.era .head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.kvs{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:10px;font-size:13.5px}
.kvs>div{display:flex;justify-content:space-between;gap:6px;border-bottom:1px dotted var(--line);padding-bottom:4px;min-width:0}
.kvs>div span:first-child{color:var(--muted)}
.kvs>div span:last-child{font-variant-numeric:tabular-nums;font-weight:500;text-align:right}
.verdict{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:13.5px;background:var(--surface-2)}
.verdict.good{background:var(--up-soft)} .verdict.bad{background:var(--down-soft)}

/* list items */
.li{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line-2);align-items:flex-start}
.li:first-child{border-top:0}
.li .ic{width:32px;height:32px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;flex:none;font-size:13px;font-weight:700;color:var(--ink-2)}
.li .ic.in{background:var(--up-soft);color:var(--up)} .li .ic.sw{background:var(--accent-soft);color:var(--accent)}
.li .body{flex:1;min-width:0}
.li .t{font-weight:500}
.li .s{font-size:12.5px;color:var(--muted)}
.li .amt{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

/* news */
.news{display:block;padding:12px 0;border-top:1px solid var(--line-2);color:inherit;text-decoration:none}
.news:first-child{border-top:0}
.news .t{font-weight:600;line-height:1.4}
.news p{margin:4px 0 6px;font-size:13.5px;color:var(--ink-2)}
.asset{display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;align-items:center;padding:9px 0;border-top:1px solid var(--line-2);font-size:14px}
.asset:first-child{border-top:0}

/* forms */
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;color:var(--ink-2);font-weight:500}
.field .hint{font-size:12px;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:15px;min-width:0}
.inp:focus{outline:2px solid var(--accent);outline-offset:-1px;background:var(--surface)}
textarea.inp{min-height:120px;resize:vertical;font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:11px;padding:11px 16px;font-weight:600;font-size:15px;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.sec{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.ghost{background:none;color:var(--accent);padding:8px 10px}
.btn.danger{background:var(--down-soft);color:var(--down)}
.btn:disabled{opacity:.5;cursor:default}
.btn.block{width:100%}
.tool{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);border:0;text-align:left;width:100%}
.tool .ti{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);display:grid;place-items:center;flex:none}
.tool .ti svg{width:20px;height:20px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tool b{display:block;font-weight:600}
.tool span{font-size:12.5px;color:var(--muted)}
.tool .chev{margin-left:auto;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);line-height:1.5}
.banner{padding:10px 12px;border-radius:11px;font-size:13px;background:var(--warn-soft);color:var(--ink);display:flex;gap:8px;align-items:flex-start}
.banner.info{background:var(--accent-soft)}
.empty{text-align:center;padding:28px 16px}
.empty h3{margin-bottom:6px}
.skel{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--surface-2),var(--line-2),var(--surface-2));background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;font-size:11.5px;color:var(--muted)}
.tabbar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="page"]{color:var(--accent);font-weight:600}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,10,20,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overscroll-behavior:contain}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sheet .sh-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.sheet .sh-h h2{font-size:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:999px;font-size:14px;z-index:60;max-width:90%;text-align:center}
.formula{font-family:var(--f-mono);font-size:12.5px;background:var(--surface-2);border-radius:9px;padding:10px 12px;line-height:1.6;overflow-x:auto;white-space:nowrap}
.masked .money{filter:blur(0)}
.hide-note{font-size:11.5px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:700px){.wrap{padding-top:8px}}
</style>

<header class="top"><div class="top-in">
  <div class="brand">
    <div class="mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent-ink)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16"/><path d="M5 15l4-4 3 3 6-7"/><path d="M14 7h4v4"/></svg></div>
    <div style="min-width:0"><b>GPF Journal</b><small id="hdrSub">สมุดบัญชี กบข. ส่วนตัว</small></div>

}

  DB = db; S.mode = 'db'; let got = 0; const done = () => { if (++got === 2) recompute(); };
  db.doc('p/ledger').onSnapshot(s => { if (s.exists) { S.ledger = structuredClone(s.data()); store.set('ledger', S.ledger); } else if (!S.isOwner) S.ledger = null; got >= 2 ? recompute() : done(); }, () => done());
  db.doc('p/user').onSnapshot(s => { if (s.exists && !s.metadata.hasPendingWrites) { const d = structuredClone(s.data()); S.user = {entries: d.entries || [], checks: d.checks || [], settings: d.settings || {}}; store.set('user', S.user); applyTheme(); } got >= 2 ? recompute() : done(); }, () => done());
  db.collection('nav').onSnapshot(qs => { const m = {}; for (const d of qs.docs) { const x = d.data(); m[d.id] = {values: x.values, source: x.source, flags: x.flags, savedAt: x.savedAt}; } S.navDb = m; store.set('navDb', m); if (got >= 2) recompute(); }, () => {});
  db.collection('news').orderBy('date', 'desc').limit(60).onSnapshot(qs => { S.news = qs.docs.map(d => ({id: d.id, ...d.data()})); store.set('news', S.news); if (S.tab === 'news') render(); }, () => {});
  setTimeout(() => { if (got < 2) { got = 2; recompute(); } }, 8000);
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const b = e.target.closest('button,[data-act]'); if (!b) return;
  if (b.dataset.tab) { S.tab = b.dataset.tab; render(); window.scrollTo({top: 0}); try { history.replaceState(null, '', '#' + S.tab); } catch {} return; }
  if (b.id === 'btnHide') { HIDE = !HIDE; store.set('hide', HIDE); render(); return; }
  if (b.id === 'btnSettings') return sheetSettings();
  if (b.dataset.step) { const i = SERIES.findIndex(s => s.date === S.asOf) + +b.dataset.step; if (SERIES[i]) { S.asOf = SERIES[i].date; S.asOfAuto = i === SERIES.length - 1; render(); } return; }
  if (b.dataset.range) { S.range = b.dataset.range; render(); return; }
  if (b.dataset.explain) return explainSheet(b.dataset.explain);
  if (b.dataset.hseg) { S.histSeg = b.dataset.hseg; S.txYear = null; render(); return; }
  if (b.dataset.year) { S.txYear = b.dataset.year === 'all' ? 'all' : (S.histSeg === 'tx' ? b.dataset.year : +b.dataset.year); render(); return; }
  if (b.dataset.era) { $('#era-' + b.dataset.era)?.scrollIntoView({behavior: 'smooth', block: 'start'}); return; }
  if (b.dataset.fper) { S.fundPeriod = b.dataset.fper; render(); return; }
  if (b.dataset.frange) { S.fundRange = b.dataset.frange; render(); return; }
  if (b.dataset.fsel) { const p = b.dataset.fsel; const i = S.fundSel.indexOf(p); if (i >= 0) { if (S.fundSel.length > 1) S.fundSel.splice(i, 1); } else if (S.fundSel.length < 6) S.fundSel.push(p); else toast('เลือกได้สูงสุด 6 แผน'); render(); return; }
  if (b.dataset.nf) { S.newsFilter = b.dataset.nf; render(); return; }
  if (b.dataset.del) { const e2 = S.user.entries.find(x => x.id === b.dataset.del); if (b.dataset.confirm !== '1') { b.dataset.confirm = '1'; b.textContent = 'ยืนยันลบ'; b.classList.add('danger'); setTimeout(() => { if (b.isConnected) { b.dataset.confirm = ''; b.textContent = 'ลบ'; b.classList.remove('danger'); } }, 3000); return; } S.user.entries = S.user.entries.filter(x => x !== e2); await saveUser(); toast('ลบรายการแล้ว'); return; }
  if (b.dataset.delnav) { if (b.dataset.confirm !== '1') { b.dataset.confirm = '1'; b.textContent = 'ยืนยันลบ'; return; } await deleteNav(b.dataset.delnav); toast('ลบ NAV แล้ว'); return; }
  const act = b.dataset.act;
  if (act === 'backup') return doBackup();
  if (act === 'explain') return explainSheet(); if (act === 'navupdate') return sheetNav(); if (act === 'contrib') return sheetContrib(); if (act === 'switch') return sheetSwitch(); if (act === 'check') return sheetCheck(); if (act === 'import') return sheetImport();
});
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (S.tab === 'home') drawHomeChart(); if (S.tab === 'funds') drawFundChart(); if (S.tab === 'history') render(); }, 150); });
document.addEventListener('change', e => { if (e.target.id === 'bkInHome' && e.target.files[0]) restoreBackup(e.target.files[0]); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

/* ---------- boot ---------- */
(function boot() {
  const h = (location.hash || '').slice(1); if (views[h]) S.tab = h;
  applyTheme();
  if (S.ledger || SA) S.mode = 'cached';
  recompute();
  initDb();
})();

</script>
<script>if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</body>
